[project]
name = "acelerador-reference"
version = "0.1.0"
description = "Bit-true Python/NumPy reference models for 04.RTL modules (Acelerador_Monitoramento_Industrial)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
