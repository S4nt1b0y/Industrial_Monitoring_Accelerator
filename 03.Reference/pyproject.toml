[project]
name = "imat-reference"
version = "0.1.0"
description = "Bit-true Python/NumPy reference models for 04.RTL modules (Industrial_Monitoring_Accelerator)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "nptdms>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["cnn*", "dataset*", "features*", "fft*", "lms*", "matrix_inv*", "mdc*", "ml_classifier*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
