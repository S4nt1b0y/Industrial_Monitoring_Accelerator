<rect width="1600" height="1160" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.small{font-size:12px}.tiny{font-size:10px}.box{fill:#fff;stroke:#b7c2d0;stroke-width:1.4}.edge{stroke:#687385;stroke-width:1.15;fill:none}.leaf text{fill:#fff}.leaf rect{stroke:none}.note{fill:#475569}</style>
<text x="60" y="54" class="title">Classificador FFT Q1.15 com arvore de decisao pequena</text>
<text x="60" y="84" class="small note">Entrada: 4 canais de aceleracao Q1.15 | Janela: 64 amostras | Features: 4 x 64 magnitudes aproximadas | Saida: classe inteira 0..3</text>
<rect x="50" y="112" width="1500" height="180" rx="8" class="box"/>
<text x="75" y="146" class="h">Extracao de features</text>
<rect x="85" y="170" width="240" height="78" rx="6" fill="#ffffff" stroke="#94a3b8"/>
<text x="101" y="202" class="h">Dataset Q1.15</text>
<text x="101" y="226" class="small note">4 colunas int16</text>
<path d="M325 209 L370 209" class="edge"/>
<path d="M362 201 L370 209 L362 217" class="edge"/>
<rect x="380" y="170" width="240" height="78" rx="6" fill="#ffffff" stroke="#94a3b8"/>
<text x="396" y="202" class="h">Janelas</text>
<text x="396" y="226" class="small note">64 amostras sem cruzar label</text>
<path d="M620 209 L665 209" class="edge"/>
<path d="M657 201 L665 209 L657 217" class="edge"/>
<rect x="675" y="170" width="240" height="78" rx="6" fill="#ffffff" stroke="#94a3b8"/>
<text x="691" y="202" class="h">FFT 64 pontos</text>
<text x="691" y="226" class="small note">real/imag em Q1.15</text>
<path d="M915 209 L960 209" class="edge"/>
<path d="M952 201 L960 209 L952 217" class="edge"/>
<rect x="970" y="170" width="240" height="78" rx="6" fill="#ffffff" stroke="#94a3b8"/>
<text x="986" y="202" class="h">Magnitude RTL-friendly</text>
<text x="986" y="226" class="small note">min(32767, |real|+|imag|)</text>
<path d="M1210 209 L1255 209" class="edge"/>
<path d="M1247 201 L1255 209 L1247 217" class="edge"/>
<rect x="1265" y="170" width="240" height="78" rx="6" fill="#ffffff" stroke="#94a3b8"/>
<text x="1281" y="202" class="h">Vetor final</text>
<text x="1281" y="226" class="small note">256 features Q1.15</text>
<text x="75" y="278" class="small note">Mapa: f[0..63]=Ax A, f[64..127]=Ay A, f[128..191]=Ax B, f[192..255]=Ay B. Cada indice guarda o bin FFT correspondente.</text>
<text x="60" y="332" class="h">Arvore treinada exportada para RTL</text>
<text x="350" y="332" class="small note">Regra: se feature[indice] &lt;= threshold_q15, vai para esquerda; caso contrario, direita.</text>
